<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><div id="stage"></div>

  lab.style.top='440px';

  path.setAttribute('style','fill:none;stroke:#f5a524;stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 7px rgba(245,165,36,.95))');sv.appendChild(path);
